<script>
/* ============================================================
   SL GAY — Client Logic
   ============================================================ */

const SB = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SL_CITIES = ["Colombo","Dehiwala","Moratuwa","Sri Jayawardenepura Kotte","Negombo","Gampaha","Kalutara","Panadura","Kandy","Galle","Matara","Jaffna","Trincomalee","Batticaloa","Anuradhapura","Kurunegala","Ratnapura","Badulla","Nuwara Eliya","Kegalle","Puttalam","Vavuniya","Mannar","Ampara","Polonnaruwa","Hambantota","Monaragala","Mullaitivu","Kilinochchi","Matale","Katunayake","Kelaniya","Beruwala","Chilaw","Dambulla","Hikkaduwa","Weligama","Mirissa","Ella","Sigiriya"];

const State = {
  user: null,
  view: 'public',
  privChannel: null,
  pendingImage: { pub: null, priv: null },
  pendingOneTime: { pub: false, priv: false },
  currentChat: null,
  heartbeatTimer: null,
  cleanupTimer: null,
};

function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
function timeAgo(d){
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<10) return 'just now';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtTime(d){
  const dt = new Date(d);
  return dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' · ' + dt.toLocaleDateString([], {month:'short',day:'numeric'});
}
function toast(msg, type='info'){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  const colors={info:'border-border bg-panel2 text-gray-300',success:'border-green-500/30 bg-green-500/10 text-green-400',error:'border-red-500/30 bg-red-500/10 text-red-400'};
  el.className=`toast-in px-4 py-2.5 rounded-xl border ${colors[type]} text-xs font-medium`;
  el.textContent=msg; c.appendChild(el);
  setTimeout(()=>el.remove(),3700);
}
function autoH(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,128)+'px'; }
function handleSend(e,kind){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); kind==='pub'?sendPublic():sendPrivate();} }
function initials(n){ return (n||'?').slice(0,2).toUpperCase(); }

async function compressImage(file, maxDim=800, quality=0.6){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w,height:h}=img;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w); w=maxDim;} else {w=Math.round(w*maxDim/h); h=maxDim;}
        }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    r.onerror=reject; r.readAsDataURL(file);
  });
}

['gLocation','sLocation'].forEach(id=>{
  const s=document.getElementById(id);
  SL_CITIES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; s.appendChild(o); });
});

function showEntryTab(t){
  ['guest','login','signup'].forEach(x=>{
    document.getElementById('form'+x.charAt(0).toUpperCase()+x.slice(1)).classList.add('hidden');
    const b=document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1));
    b.className='entry-tab py-3 rounded-xl text-xs font-semibold '+(x===t?'bg-panel2 text-white':'text-muted hover:text-white');
  });
  document.getElementById('form'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');
}

async function checkNameAvailable(name){
  const { data:u } = await SB.from('users').select('username').eq('username',name).maybeSingle();
  if(u) return { available:false, reason:'registered' };
  const cutoff=new Date(Date.now()-90000).toISOString();
  const { data:p } = await SB.from('presence').select('username').eq('username',name).gte('last_seen',cutoff).maybeSingle();
  if(p) return { available:false, reason:'online' };
  return { available:true };
}

async function generateSuggestions(base){
  const suffix=['_lk','92','_sl','x','anon','ceylon','_gay','2024','col','kandy'];
  const out=[];
  let attempts=0;
  while(out.length<3 && attempts<25){
    attempts++;
    const s = base + suffix[Math.floor(Math.random()*suffix.length)] + Math.floor(Math.random()*90+10);
    const { available } = await checkNameAvailable(s);
    if(available && !out.includes(s)) out.push(s);
  }
  while(out.length<3){ out.push(base+(Date.now().toString().slice(-4)+out.length)); }
  return out;
}

async function guestEnter(){
  const name = document.getElementById('gName').value.trim().replace(/\s+/g,'_');
  const loc  = document.getElementById('gLocation').value || null;
  if(!name || name.length<3){ toast('Enter a name (min 3 chars)','error'); return; }

  const { data:ban } = await SB.from('bans').select('username').eq('username',name).maybeSingle();
  if(ban){ toast('This name is banned.','error'); return; }

  const { available } = await checkNameAvailable(name);
  if(!available){
    const s = await generateSuggestions(name);
    const box = document.getElementById('gSuggest');
    const list = document.getElementById('gSuggestList');
    list.innerHTML = s.map(n=>`<button onclick="document.getElementById('gName').value='${n}';document.getElementById('gSuggest').classList.add('hidden')" class="px-3 py-1.5 bg-panel border border-border rounded-lg text-xs hover:border-border2">${n}</button>`).join('');
    box.classList.remove('hidden');

  const { error } = await SB.from('presence').upsert({ username:name, is_guest:true, location:loc, last_seen:new Date().toISOString(), kicked:false }, { onConflict:'username' });
  if(error){ toast('Enter failed: '+error.message,'error'); return; }

async function signupUser(){

  const loc  = document.getElementById('sLocation').value || null;

async function loginUser(){
  const name = document.getElementById('lName').value.trim();
  const pass = document.getElementById('lPass').value;
  if(!name||!pass){ toast('Enter credentials','error'); return; }

  const { data:ban } = await SB.from('bans').select('username').eq('username',name).maybeSingle();
  if(ban){ toast('This account is banned.','error'); return; }

  const { data:u, error } = await SB.from('users').select('*').eq('username',name).maybeSingle();
  if(error||!u){ toast('Account not found','error'); return; }
  if(u.is_banned){ toast('Account banned: '+(u.ban_reason||''),'error'); return; }
  if(u.password!==pass){ toast('Wrong password','error'); return; }

  await SB.from('presence').delete().eq('username',name);
  await SB.from('presence').upsert({ username:name, is_guest:false, location:u.location, last_seen:new Date().toISOString(), kicked:false },{onConflict:'username'});
  await SB.from('users').update({ last_seen:new Date().toISOString() }).eq('id',u.id);

  State.user = { username:u.username, isGuest:false, isAdmin:!!u.is_admin, location:u.location };
  enterApp();
}

function enterApp(){
  document.getElementById('entryScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('navUser').textContent = State.user.username + (State.user.isGuest?' (guest)':'');
  document.getElementById('navLoc').textContent = State.user.location || '';
  document.getElementById('navAvatar').textContent = initials(State.user.username);
  if(State.user.isAdmin){
    document.getElementById('adminNavBtn').classList.remove('hidden');
    document.getElementById('adminNavBtnM').classList.remove('hidden');
  }
  document.getElementById('accUsername').textContent = State.user.username;
  document.getElementById('accPassword').textContent = State.user.isGuest?'— (guest)':'••••••';
  document.getElementById('accLocation').textContent = State.user.location || 'Not set';
  document.getElementById('accType').textContent = State.user.isAdmin?'Administrator':(State.user.isGuest?'Anonymous Guest':'Registered User');

  if(!State.user.isGuest){
    SB.from('users').select('password').eq('username',State.user.username).maybeSingle().then(({data})=>{
      if(data) document.getElementById('accPassword').textContent = data.password;
    });

  loadNotice();

  startHeartbeat();
  startCleanupLoop();

}

function startHeartbeat(){
  const beat = async () => {
    if(!State.user) return;
    const { data:p } = await SB.from('presence').select('kicked').eq('username',State.user.username).maybeSingle();
    if(p?.kicked){ toast('You were kicked by admin','error'); logoutUser(); return; }
    await SB.from('presence').update({ last_seen:new Date().toISOString() }).eq('username',State.user.username);
    if(!State.user.isGuest){
      await SB.from('users').update({ last_seen:new Date().toISOString() }).eq('username',State.user.username);
    }
  };
  beat();
  State.heartbeatTimer = setInterval(beat, 20000);
}

function startCleanupLoop(){
  const run = async () => {
    const now = new Date().toISOString();
    try {
      await SB.from('public_messages').delete().lt('expires_at', now);
      await SB.from('private_messages').delete().lt('expires_at', now);

      const { data:pub } = await SB.from('public_messages').select('id,target_viewers,viewed_by,is_one_time').eq('is_one_time',true);
      (pub||[]).forEach(async m=>{
        const tv = new Set(m.target_viewers||[]);
        const vb = new Set(m.viewed_by||[]);
        let all=true; tv.forEach(u=>{ if(!vb.has(u)) all=false; });
        if(all && tv.size>0) await SB.from('public_messages').delete().eq('id',m.id);
      });
      const { data:priv } = await SB.from('private_messages').select('id,target_viewers,viewed_by,is_one_time').eq('is_one_time',true);
      (priv||[]).forEach(async m=>{
        const tv = new Set(m.target_viewers||[]);
        const vb = new Set(m.viewed_by||[]);
        let all=true; tv.forEach(u=>{ if(!vb.has(u)) all=false; });
        if(all && tv.size>0) await SB.from('private_messages').delete().eq('id',m.id);
      });
    } catch(e){ console.warn('cleanup',e); }
  };
  run();
  State.cleanupTimer = setInterval(run, 60000);
}

async function logoutUser(){
  if(State.user){
    await SB.from('presence').delete().eq('username',State.user.username);
  }
  clearInterval(State.heartbeatTimer);
  clearInterval(State.cleanupTimer);
  SB.removeAllChannels();
  location.reload();
}

  const el = document.getElementById(map[v]);
  if(el){
    el.classList.remove('hidden');
    if(v==='private-chat') el.classList.add('flex','flex-col'); else el.classList.add('flex');

  document.querySelectorAll('[data-nav]').forEach(b=>{

    else { b.classList.remove('active'); b.classList.add('text-muted'); }
  });
  State.view = v;
  if(v==='private') loadPrivateChats();
  if(v==='admin') renderAdmin();
}

async function pickImage(evt, kind, oneTime=false){
  const file = evt.target.files[0];
  if(!file) return;
  toast('Compressing image...','info');
  const compressed = await compressImage(file, oneTime?900:800, oneTime?0.75:0.6);
  State.pendingImage[kind] = compressed;
  State.pendingOneTime[kind] = oneTime;
  const prev = document.getElementById(kind==='pub'?'pubPreview':'privPreview');
  const img  = document.getElementById(kind==='pub'?'pubPreviewImg':'privPreviewImg');
  const nm   = document.getElementById(kind==='pub'?'pubPreviewName':'privPreviewName');
  img.src = compressed;
  nm.textContent = (oneTime?'⏱ One-time image · ':'📷 Image · ') + Math.round(compressed.length/1024) + ' KB';
  prev.classList.remove('hidden');
  evt.target.value='';
}
function cancelImage(kind){
  State.pendingImage[kind]=null; State.pendingOneTime[kind]=false;
  document.getElementById(kind==='pub'?'pubPreview':'privPreview').classList.add('hidden');
}
async function submitImage(kind){
  const data = State.pendingImage[kind];
  const isOneTime = State.pendingOneTime[kind];
  cancelImage(kind);
  if(!data) return;

  let targets = [];
  if(isOneTime){
    const cutoff=new Date(Date.now()-90000).toISOString();
    const { data:ps } = await SB.from('presence').select('username').gte('last_seen',cutoff);
    targets = (ps||[]).map(p=>p.username);
  }

  const expires_at = isOneTime ? new Date(Date.now()+24*3600*1000).toISOString() : null;

  if(kind==='pub'){
    const { error } = await SB.from('public_messages').insert({
      sender:State.user.username, is_guest:State.user.isGuest, location:State.user.location,
      msg_type:'image', image_data:data, is_one_time:isOneTime,
      target_viewers:targets, viewed_by:[], expires_at
    });
    if(error){ toast('Send failed: '+error.message,'error'); return; }
  } else {
    const { error } = await SB.from('private_messages').insert({
      chat_id:State.currentChat.id, sender:State.user.username,
      msg_type:'image', image_data:data, is_one_time:isOneTime,
      target_viewers:targets, viewed_by:[], expires_at
    });
    if(error){ toast('Send failed: '+error.message,'error'); return; }
  }
  toast('Image sent','success');
}

let imgModalURL = null;
async function handleImageView(evt, id, kind, isOneTime, alreadyViewed){
  evt.stopPropagation();
  const src = evt.target.src;
  imgModalURL = src;

  // Reveal one-time in place
  if(isOneTime && !alreadyViewed){
    evt.target.classList.add('revealed');
    evt.target.style.filter = 'none';
    evt.target.style.pointerEvents = 'auto';
  }

  document.getElementById('imgModalImg').src = src;
  document.getElementById('imgModal').classList.remove('hidden');
  document.getElementById('imgModal').classList.add('flex');

  if(isOneTime && !alreadyViewed){
    const table = kind==='pub'?'public_messages':'private_messages';
    const { data:m } = await SB.from(table).select('viewed_by').eq('id',id).maybeSingle();
    const vb = new Set(m?.viewed_by||[]); vb.add(State.user.username);
    await SB.from(table).update({ viewed_by:Array.from(vb) }).eq('id',id);
  }
}
function closeImgModal(evt){
  if(evt && evt.target.id !== 'imgModal') return;
  document.getElementById('imgModal').classList.add('hidden');

async function deleteMsg(kind, id){

}

async function openPrivateWith(otherUser){
  if(otherUser===State.user.username){ toast('That is you 🙂'); return; }
  const [a,b] = [State.user.username, otherUser].sort();
  let { data:chat } = await SB.from('private_chats').select('*').eq('user_a',a).eq('user_b',b).maybeSingle();
  if(!chat){
    const r = await SB.from('private_chats').insert({ user_a:a, user_b:b }).select().single();
    if(r.error){ toast('Could not open chat: '+r.error.message,'error'); return; }
    chat = r.data;
  }
  State.currentChat = { id:chat.id, otherUser };
  document.getElementById('pcName').textContent = otherUser;
  document.getElementById('pcAvatar').textContent = initials(otherUser);
  await updatePrivateStatus();
  await loadPrivateMessages();
  showView('private-chat');
  subscribePrivateChat(chat.id);
}

async function updatePrivateStatus(){
  if(!State.currentChat) return;
  const other = State.currentChat.otherUser;
  const { data:p } = await SB.from('presence').select('last_seen').eq('username',other).maybeSingle();
  const { data:u } = await SB.from('users').select('last_seen').eq('username',other).maybeSingle();
  const last = p?.last_seen || u?.last_seen;
  if(!last){ document.getElementById('pcStatus').textContent='Last seen: unknown'; return; }
  const diff = (Date.now() - new Date(last))/1000;
  if(diff<90) document.getElementById('pcStatus').innerHTML = '<span class="text-green-400">● Online</span>';
  else document.getElementById('pcStatus').textContent = 'Last seen ' + timeAgo(last);
}

async function loadPrivateChats(){
  const me = State.user.username;
  const { data:chats } = await SB.from('private_chats')
    .select('*')
    .or(`user_a.eq.${me},user_b.eq.${me}`)
    .order('last_message_at',{ascending:false});
  const box = document.getElementById('privateChatsList');
  if(!chats || !chats.length){ box.innerHTML='<p class="text-sm text-muted">No private chats yet. Click a username in Public Chat to start.</p>'; return; }
  box.innerHTML='';
  for(const c of chats){
    const other = c.user_a===me ? c.user_b : c.user_a;
    const { data:p } = await SB.from('presence').select('last_seen').eq('username',other).maybeSingle();
    const online = p && (Date.now()-new Date(p.last_seen))/1000 < 90;
    const el = document.createElement('button');
    el.className='w-full text-left bg-panel border border-border hover:border-border2 rounded-xl p-4 flex items-center gap-3';
    el.onclick = ()=> openPrivateWith(other);
    el.innerHTML = `

      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold">${esc(other)}</p>
        <p class="text-[10px] ${online?'text-green-400':'text-muted'}">${online?'● Online':'Last seen '+timeAgo(p?.last_seen||c.last_message_at)}</p>
      </div>
      <div class="text-[10px] text-muted">${timeAgo(c.last_message_at)}</div>`;
    box.appendChild(el);
  }
}

function subscribeRealtime(){
  SB.channel('notice-ch')
    .on('postgres_changes',{event:'*',schema:'public',table:'notice_board'},()=>loadNotice())
    .subscribe();

  SB.channel('pub-ch')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'public_messages'},payload=>{
      if(State.view!=='public') return;
      const box = document.querySelector('#publicMessages .max-w-3xl');
      if(box.querySelector('[data-id="'+payload.new.id+'"]')) return;
      box.appendChild(renderPublicMsg(payload.new));
      scrollPublic();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'public_messages'},()=>loadPublicMessages())
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'public_messages'},payload=>{
      document.querySelectorAll(`[data-id="${payload.old.id}"]`).forEach(e=>e.remove());
    })
    .subscribe();

  SB.channel('chatlist-ch')
    .on('postgres_changes',{event:'*',schema:'public',table:'private_chats'},()=>{
      if(State.view==='private') loadPrivateChats();
    })
    .subscribe();
}

function subscribePrivateChat(chatId){
  if(State.privChannel) SB.removeChannel(State.privChannel);
  State.privChannel = SB.channel('priv-'+chatId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages',filter:`chat_id=eq.${chatId}`},payload=>{
      const box = document.querySelector('#privateMessages .max-w-3xl');
      if(box.querySelector('[data-id="'+payload.new.id+'"]')) return;
      box.appendChild(renderPrivateMsg(payload.new));
      const sc=document.getElementById('privateMessages'); sc.scrollTop=sc.scrollHeight;
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'private_messages',filter:`chat_id=eq.${chatId}`},()=>loadPrivateMessages())
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'private_messages'},payload=>{
      document.querySelectorAll(`[data-id="${payload.old.id}"]`).forEach(e=>e.remove());
    })
    .subscribe();
}

/* ============================================================
   ADMIN PANEL
   ============================================================ */
let adminCurrentTab = 'notice';
function adminTab(t){
  adminCurrentTab=t;
  document.querySelectorAll('[data-atab]').forEach(b=>{
    if(b.dataset.atab===t){ b.classList.add('bg-white','text-black'); b.classList.remove('bg-panel2'); }
    else { b.classList.remove('bg-white','text-black'); b.classList.add('bg-panel2'); }
  });
  renderAdmin();
}
async function renderAdmin(){
  const box = document.getElementById('adminContent');
  box.innerHTML='<p class="text-xs text-muted">Loading...</p>';
  if(adminCurrentTab==='notice') return adminNotice(box);
  if(adminCurrentTab==='users') return adminUsers(box);
  if(adminCurrentTab==='public') return adminPublic(box);
  if(adminCurrentTab==='private') return adminPrivate(box);
  if(adminCurrentTab==='onetime') return adminOneTime(box);
  if(adminCurrentTab==='bans') return adminBans(box);
}

async function adminNotice(box){
  const { data } = await SB.from('notice_board').select('*').eq('id',1).maybeSingle();
  box.innerHTML = `
    <div class="bg-panel border border-border rounded-2xl p-5 space-y-3">
      <label class="text-[10px] uppercase tracking-widest text-muted">Notice Content</label>
      <textarea id="nContent" rows="3" class="w-full px-4 py-3 bg-panel2 border border-border rounded-xl text-sm">${esc(data?.content||'')}</textarea>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 text-xs">
          <input type="checkbox" id="nVisible" ${data?.is_visible?'checked':''} class="w-4 h-4">
          <span>Show notice board</span>
        </label>
        <button onclick="saveNotice()" class="ml-auto px-4 py-2 bg-white text-black rounded-lg text-xs font-semibold">Save</button>
        <button onclick="deleteNotice()" class="px-4 py-2 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs">Delete</button>
      </div>
    </div>`;
}
async function saveNotice(){
  const content=document.getElementById('nContent').value;
  const is_visible=document.getElementById('nVisible').checked;
  await SB.from('notice_board').update({ content, is_visible, updated_at:new Date().toISOString() }).eq('id',1);
  toast('Notice updated','success'); loadNotice();
}
async function deleteNotice(){
  await SB.from('notice_board').update({ content:'', is_visible:false }).eq('id',1);
  toast('Notice cleared','success'); adminTab('notice'); loadNotice();
}

async function adminUsers(box){
  const { data:users } = await SB.from('users').select('*').order('created_at',{ascending:false});
  const { data:pres } = await SB.from('presence').select('*');
  const presence = new Map((pres||[]).map(p=>[p.username,p]));
  let html = '<div class="space-y-2">';
  html += `<div class="text-[10px] uppercase tracking-widest text-muted mt-1 mb-2">Registered Users (${users?.length||0})</div>`;
  (users||[]).forEach(u=>{
    const isOnline = presence.has(u.username) && (Date.now()-new Date(presence.get(u.username).last_seen))/1000<90;
    html += `
      <div class="bg-panel border border-border rounded-xl p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-panel2 flex items-center justify-center text-xs font-bold">${initials(u.username)}</div>
        <div class="flex-1">
          <p class="text-sm font-semibold">${esc(u.username)} ${u.is_admin?'<span class="text-[9px] text-muted">(admin)</span>':''} ${isOnline?'<span class="text-[9px] text-green-400">● online</span>':''}</p>
          <p class="text-[10px] text-muted">${u.location||'—'} · joined ${timeAgo(u.created_at)}</p>
        </div>
        ${u.is_banned?'<span class="text-[9px] px-2 py-1 bg-red-500/20 text-red-400 rounded">banned</span>':''}
        <button onclick="adminKick('${u.username}')" class="text-[10px] px-2 py-1 bg-panel2 border border-border rounded hover:border-border2">Kick</button>
        <button onclick="adminBan('${u.username}')" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded">Ban</button>
        <button onclick="adminDeleteAccount('${u.username}')" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded">Delete</button>
      </div>`;
  });
  const guests = (pres||[]).filter(p=>p.is_guest && (Date.now()-new Date(p.last_seen))/1000<90);
  html += `<div class="text-[10px] uppercase tracking-widest text-muted mt-4 mb-2">Active Guests (${guests.length})</div>`;
  guests.forEach(g=>{
    html += `
      <div class="bg-panel border border-border rounded-xl p-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-panel2 flex items-center justify-center text-xs font-bold">${initials(g.username)}</div>
        <div class="flex-1">
          <p class="text-sm font-semibold">${esc(g.username)} <span class="text-[9px] text-muted">(guest)</span></p>
          <p class="text-[10px] text-muted">${g.location||'—'} · seen ${timeAgo(g.last_seen)}</p>
        </div>
        <button onclick="adminKick('${g.username}')" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded">Kick</button>
        <button onclick="adminBan('${g.username}')" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded">Ban</button>
      </div>`;
  });
  html += '</div>';
  box.innerHTML = html;
}
async function adminKick(name){
  await SB.from('presence').update({ kicked:true }).eq('username',name);
  toast('Kicked '+name,'success'); adminTab('users');
}
async function adminBan(name){
  const reason = prompt('Ban reason:','Violated rules') || 'Banned';
  await SB.from('bans').upsert({ username:name, reason, banned_by:State.user.username });
  await SB.from('users').update({ is_banned:true, ban_reason:reason }).eq('username',name);
  await SB.from('presence').delete().eq('username',name);
  toast('Banned '+name,'success'); adminTab('users');
}
async function adminDeleteAccount(name){
  if(!confirm('Permanently delete account "'+name+'"?')) return;
  await SB.from('users').delete().eq('username',name);
  await SB.from('presence').delete().eq('username',name);
  toast('Account deleted','success'); adminTab('users');
}

async function adminPublic(box){
  const { data } = await SB.from('public_messages').select('*').order('created_at',{ascending:false}).limit(200);
  let html='<div class="space-y-2">';
  (data||[]).forEach(m=>{
    html += `
      <div class="bg-panel border border-border rounded-xl p-3 flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-semibold text-gray-300">${esc(m.sender)} <span class="text-muted font-normal">· ${fmtTime(m.created_at)}</span></p>
          ${m.msg_type==='image'
            ? `<img src="${m.image_data}" class="mt-2 max-w-[200px] rounded-lg border border-border">`
            : `<p class="text-sm text-gray-200 mt-1 break-words">${esc(m.content)}</p>`}
        </div>
        <button onclick="deleteMsg('pub',${m.id});setTimeout(()=>adminTab('public'),300)" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded">Delete</button>
      </div>`;
  });
  html+='</div>';
  box.innerHTML=html;
}

async function adminPrivate(box){
  const { data:chats } = await SB.from('private_chats').select('*').order('last_message_at',{ascending:false});
  let html='<div class="space-y-2">';
  (chats||[]).forEach(c=>{
    html += `
      <details class="bg-panel border border-border rounded-xl">
        <summary class="p-3 cursor-pointer flex items-center gap-3">
          <div class="flex-1">
            <p class="text-sm font-semibold">${esc(c.user_a)} ↔ ${esc(c.user_b)}</p>
            <p class="text-[10px] text-muted">Last activity: ${timeAgo(c.last_message_at)}</p>
          </div>
          <button onclick="event.preventDefault();event.stopPropagation();adminViewChat('${c.id}')" class="text-[10px] px-2 py-1 bg-panel2 border border-border rounded">Open</button>
        </summary>
        <div id="chat_${c.id}" class="p-3 pt-0"></div>
      </details>`;
  });
  html+='</div>';
  box.innerHTML=html;
}
async function adminViewChat(chatId){
  const box = document.getElementById('chat_'+chatId);
  if(box.dataset.loaded) return;
  box.dataset.loaded='1';
  const { data } = await SB.from('private_messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true}).limit(300);
  box.innerHTML = (data||[]).map(m=>`
    <div class="border-t border-border pt-2 mt-2 flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <p class="text-[10px] font-semibold text-gray-300">${esc(m.sender)} <span class="text-muted font-normal">· ${fmtTime(m.created_at)}</span> ${m.is_one_time?'<span class="text-[9px] px-1.5 py-0.5 bg-panel2 rounded border border-border">one-time</span>':''}</p>
        ${m.msg_type==='image'
          ? `<img src="${m.image_data}" class="mt-1 max-w-[180px] rounded-lg border border-border cursor-pointer" data-full="${encodeURIComponent(m.image_data)}" onclick="adminOpenImg(this.dataset.full)">`
          : `<p class="text-xs text-gray-200 mt-0.5 break-words">${esc(m.content)}</p>`}
      </div>
      <button onclick="deleteMsg('priv',${m.id});this.parentElement.remove()" class="text-[10px] px-2 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded shrink-0">Delete</button>
    </div>`).join('') || '<p class="text-xs text-muted">No messages</p>';
}

async function adminOneTime(box){
  const { data:pub } = await SB.from('public_messages').select('*').eq('is_one_time',true);
  const { data:priv } = await SB.from('private_messages').select('*').eq('is_one_time',true);
  const all = [
    ...(pub||[]).map(m=>({...m, kind:'pub'})),
    ...(priv||[]).map(m=>({...m, kind:'priv'}))
  ];
  let html = `<div class="text-[10px] uppercase tracking-widest text-muted mb-2">One-time images (admin can view/download all) — ${all.length} total</div><div class="grid grid-cols-2 md:grid-cols-4 gap-2">`;
  all.forEach(m=>{
    html += `
      <div class="bg-panel border border-border rounded-xl overflow-hidden">
        <img src="${m.image_data}" class="w-full aspect-square object-cover cursor-pointer" onclick="adminOpenImg('${encodeURIComponent(m.image_data)}')">
        <div class="p-2 flex justify-between items-center">
          <span class="text-[9px] text-muted truncate">${esc(m.sender)}</span>
          <button onclick="deleteOneTime(${m.id},'${m.kind}')" class="text-[9px] text-red-400 shrink-0 ml-2">delete</button>
        </div>
      </div>`;
  });
  if(!all.length) html += '<p class="text-xs text-muted col-span-4">No one-time images</p>';
  html += '</div>';
  box.innerHTML = html;
}
function adminOpenImg(data){
  const url = decodeURIComponent(data);
  document.getElementById('imgModalImg').src = url;
  document.getElementById('imgModal').classList.remove('hidden');
  document.getElementById('imgModal').classList.add('flex');
  imgModalURL = url;
}
async function deleteOneTime(id, kind){
  const t = kind==='pub'?'public_messages':'private_messages';
  await SB.from(t).delete().eq('id',id);
  adminTab('onetime');
}

async function adminBans(box){
  const { data } = await SB.from('bans').select('*').order('banned_at',{ascending:false});
  let html='<div class="space-y-2">';
  (data||[]).forEach(b=>{
    html += `
      <div class="bg-panel border border-border rounded-xl p-3 flex items-center gap-3">
        <div class="flex-1">
          <p class="text-sm font-semibold">${esc(b.username)}</p>
          <p class="text-[10px] text-muted">${esc(b.reason||'')} · by ${esc(b.banned_by||'admin')} · ${timeAgo(b.banned_at)}</p>
        </div>
        <button onclick="adminUnban('${b.username}')" class="text-[10px] px-2 py-1 bg-panel2 border border-border rounded hover:border-border2">Unban</button>
      </div>`;
  });
  if(!data?.length) html+='<p class="text-xs text-muted">No bans</p>';
  html+='</div>';
  box.innerHTML=html;
}
async function adminUnban(name){
  await SB.from('bans').delete().eq('username',name);
  await SB.from('users').update({ is_banned:false, ban_reason:null }).eq('username',name);
  toast('Unbanned '+name,'success'); adminTab('bans');
}

document.addEventListener('DOMContentLoaded', ()=>{
  ['gName','sName'].forEach(id=>{
    document.getElementById(id).addEventListener('blur', async (e)=>{
      const v=e.target.value.trim();
      if(v.length<3) return;
      const { available } = await checkNameAvailable(v);
      if(!available){
        const box = id==='gName'?'gSuggest':'sSuggest';
        const list = id==='gName'?'gSuggestList':'sSuggestList';
        const s = await generateSuggestions(v);
        document.getElementById(list).innerHTML = s.map(n=>`<button onclick="document.getElementById('${id}').value='${n}';document.getElementById('${box}').classList.add('hidden')" class="px-3 py-1.5 bg-panel border border-border rounded-lg text-xs hover:border-border2">${n}</button>`).join('');
        document.getElementById(box).classList.remove('hidden');
      } else {
        document.getElementById(id==='gName'?'gSuggest':'sSuggest').classList.add('hidden');
      }
    });
  });
});
</script>
